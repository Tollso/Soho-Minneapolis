<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Antonio:wght@700&amp;family=Bebas+Neue&amp;family=Montserrat:wght@500;600&amp;display=swap');

    .soho-brand-title-white {
      font-family: 'Antonio', 'Bebas Neue', 'Alternate Gothic', 'Arial Narrow', sans-serif;
      font-weight: 700;
      letter-spacing: 6px;
      text-anchor: middle;
      fill: #FFFFFF;
    }

    .soho-brand-subtitle-white {
      font-family: 'Montserrat', 'Antonio', sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 6.5px;
      text-anchor: middle;
      fill: #E5E5E5;
    }
  </style>

  <!-- Only the single Soho Circular Ring (No second frame) -->
  <circle
    cx="150"
    cy="150"
    r="132"
    fill="#070709"
    stroke="#FFFFFF"
    stroke-width="2.2"
  />

  <!-- Stacked Soho Brandmark: "SO" over "HO" (Clean, Sharp & High-Contrast) -->
  <g>
    <!-- Top Line: SO -->
    <text x="153" y="132" font-size="94" class="soho-brand-title-white">SO</text>

    <!-- Bottom Line: HO -->
    <text x="153" y="218" font-size="94" class="soho-brand-title-white">HO</text>
  </g>

  <!-- Subtitle: — LOUNGE — -->
  <g>
    <!-- Left Divider Line -->
    <line x1="74" y1="237" x2="98" y2="237" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />

    <!-- LOUNGE Text -->
    <text x="153" y="241" class="soho-brand-subtitle-white">LOUNGE</text>

    <!-- Right Divider Line -->
    <line x1="202" y1="237" x2="226" y2="237" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
